name: Core Wheel Verification

on:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Check wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          assert "rfg/openapi.yaml" in names
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)
          assert not [name for name in names if name.startswith(("demo/", "tests/", "data/"))]
          PY
      - name: Test installed wheel
        run: |
          python -m venv .ci-venv
          wheel="$(realpath dist/*.whl)"
          .ci-venv/bin/python -m pip install "${wheel}[dev]"
          .ci-venv/bin/python -m pytest -q -o pythonpath= tests
