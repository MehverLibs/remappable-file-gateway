<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">RemappableFileGateway integration in a FastAPI backend</title>
  <desc id="desc">A Docker container holds filesystem mounts, a FastAPI backend with separate application business logic and RemappableFileGateway modules, and a business frontend. Horizontal arrows show each backend module connecting independently to filesystem storage and frontend features.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#1e293b" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { fill: #0f172a; font-size: 24px; font-weight: 700; }
      .label { fill: #334155; font-size: 16px; font-weight: 650; }
      .detail { fill: #475569; font-size: 14px; }
      .edge-label { fill: #1e293b; font-size: 11px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1400" height="620" rx="24" fill="url(#canvas)"/>
  <rect x="28" y="28" width="1344" height="564" rx="22" fill="#f8fafc" fill-opacity="0.58" stroke="#64748b" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="54" y="17" width="190" height="28" rx="14" fill="#334155"/>
  <text class="text" x="149" y="36" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">DOCKER CONTAINER</text>

  <text class="text heading" x="209" y="92" text-anchor="middle">FILESYSTEM MOUNTS</text>
  <rect x="58" y="112" width="302" height="450" rx="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/>

  <rect x="72" y="140" width="274" height="248" rx="15" fill="#e2e8f0" fill-opacity="0.72" stroke="#334155" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="88" y="121" width="172" height="46" rx="12" fill="#334155"/>
  <text class="text" x="174" y="141" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Configuration Data</text>
  <text class="text" x="174" y="157" fill="#cbd5e1" font-size="10" font-weight="650" text-anchor="middle">High-Speed Storage</text>

  <rect x="88" y="175" width="242" height="60" rx="10" fill="#e2e8f0"/>
  <path d="M 103 191 h 18 l 7 7 h 22 v 20 h -47 z" fill="#334155"/>
  <text class="text label" x="162" y="211">Business Data Root</text>

  <rect x="88" y="315" width="242" height="60" rx="10" fill="#e2e8f0"/>
  <path d="M 103 331 h 18 l 7 7 h 22 v 20 h -47 z" fill="#334155"/>
  <text class="text label" x="162" y="351">RFG Mapping State</text>

  <rect x="72" y="425" width="274" height="123" rx="15" fill="#dbeafe" fill-opacity="0.72" stroke="#334155" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="88" y="406" width="184" height="46" rx="12" fill="#334155"/>
  <text class="text" x="180" y="426" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Resource Data</text>
  <text class="text" x="180" y="442" fill="#cbd5e1" font-size="10" font-weight="650" text-anchor="middle">High-Capacity Storage</text>

  <rect x="88" y="470" width="242" height="60" rx="10" fill="#e2e8f0"/>
  <path d="M 103 486 h 18 l 7 7 h 22 v 20 h -47 z" fill="#334155"/>
  <text class="text label" x="162" y="506">Bulk Resource Pool</text>

  <text class="text heading" x="704" y="92" text-anchor="middle">FASTAPI BACKEND</text>
  <rect x="398" y="112" width="612" height="450" rx="22" fill="#ffffff" stroke="#475569" stroke-width="2"/>

  <rect x="430" y="160" width="550" height="90" rx="15" fill="#e2e8f0" stroke="#94a3b8"/>
  <text class="text label" x="705" y="193" text-anchor="middle">Application Business Logic</text>
  <text class="text detail" x="705" y="217" text-anchor="middle">domain services / persistence / business rules</text>
  <text class="text detail" x="705" y="238" text-anchor="middle">owned and implemented by the host application</text>

  <g filter="url(#shadow)">
    <rect x="430" y="290" width="550" height="245" rx="22" fill="url(#wheel)"/>
    <rect x="446" y="306" width="518" height="213" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.28"/>
  </g>
  <text class="text" x="705" y="389" fill="#ffffff" font-size="26" font-weight="750" text-anchor="middle">RemappableFileGateway</text>
  <text class="text" x="705" y="422" fill="#dbeafe" font-size="19" font-weight="650" text-anchor="middle">installed python wheel</text>
  <line x1="570" y1="447" x2="840" y2="447" stroke="#ffffff" stroke-opacity="0.35"/>
  <text class="text" x="705" y="476" fill="#eff6ff" font-size="14" text-anchor="middle">catalog / mapping / hashing / safe resource delivery</text>

  <text class="text heading" x="1200" y="92" text-anchor="middle">BUSINESS FRONTEND</text>
  <rect x="1048" y="112" width="304" height="450" rx="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/>

  <rect x="1072" y="170" width="256" height="70" rx="11" fill="#e2e8f0"/>
  <text class="text label" x="1200" y="200" text-anchor="middle">Business Application UI</text>
  <text class="text detail" x="1200" y="221" text-anchor="middle">http json business api</text>

  <rect x="1072" y="310" width="256" height="70" rx="11" fill="#e0e7ff"/>
  <text class="text label" x="1200" y="340" text-anchor="middle">Catalog And Mapping Tools</text>
  <text class="text detail" x="1200" y="361" text-anchor="middle">http json mapping api</text>

  <rect x="1072" y="465" width="256" height="70" rx="11" fill="#dbeafe"/>
  <text class="text label" x="1200" y="495" text-anchor="middle">Mapped Resources</text>
  <text class="text detail" x="1200" y="516" text-anchor="middle">http file transfer with range support</text>

  <path d="M 330 205 H 430" fill="none" stroke="#334155" stroke-width="3" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>
  <rect x="355" y="163" width="50" height="30" rx="9" fill="#ffffff" stroke="#94a3b8"/>
  <text class="text edge-label" x="380" y="183" text-anchor="middle">R/W</text>

  <path d="M 980 205 H 1072" fill="none" stroke="#2563eb" stroke-width="3"/>

  <path d="M 330 345 H 430" fill="none" stroke="#334155" stroke-width="3" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>
  <rect x="355" y="303" width="50" height="30" rx="9" fill="#ffffff" stroke="#94a3b8"/>
  <text class="text edge-label" x="380" y="323" text-anchor="middle">R/W</text>

  <path d="M 980 345 H 1072" fill="none" stroke="#2563eb" stroke-width="3"/>

  <path d="M 330 500 H 430" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <rect x="355" y="458" width="50" height="30" rx="9" fill="#ffffff" stroke="#94a3b8"/>
  <text class="text edge-label" x="380" y="478" text-anchor="middle">RO</text>
  <circle cx="330" cy="500" r="4" fill="#334155"/>

  <path d="M 980 500 H 1072" fill="none" stroke="#2563eb" stroke-width="3"/>
</svg>
