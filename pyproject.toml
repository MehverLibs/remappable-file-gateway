[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "remappable-file-gateway"
version = "1.0.0"
description = "JSON-backed remappable local file gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mehver" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pillow>=10,<14",
  "imagehash>=4.3,<5",
  "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/MehverLibs/remappable-file-gateway"
Repository = "https://github.com/MehverLibs/remappable-file-gateway"
Issues = "https://github.com/MehverLibs/remappable-file-gateway/issues"

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/rfg"]

[tool.hatch.build.targets.wheel.force-include]
"docs/api/openapi.yaml" = "rfg/openapi.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".pytest_cache"
